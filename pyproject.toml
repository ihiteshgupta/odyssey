[project]
name = "odyssey"
version = "0.1.0"
description = "Conversational travel agent on ADK + Gemini + A2A + UCP + AP2"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a,eval]>=2.1.0,<3",
    "a2a-sdk==0.3.24",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@e1ea56db72a6385bce3e5c1112b3a56ce60acb43",
    "ucp-sdk>=0.3.0",
    "sse-starlette>=3.4.4",
    "firecrawl==4.28.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["odyssey"]

[tool.ruff]
line-length = 100
extend-exclude = ["video-build"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
